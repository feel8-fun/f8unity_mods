name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.81.0

      - name: Install Pixi environment
        run: pixi install --locked

      - name: Restore .NET packages
        run: dotnet restore F8UnityMods.sln --configfile NuGet.config

      - name: Build exporters
        run: pixi run --locked python -m tools.build build --exporter both --backend both

      - name: Validate configs
        run: pixi run --locked config-validate

      - name: Python syntax check
        run: pixi run --locked pycheck

      - name: Python unit tests
        run: pixi run --locked test

      - name: Package release zips
        run: pixi run --locked release-package

      - name: Build setup wheel
        run: pixi run --locked setup-wheel

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f8unitymods-build-artifacts
          path: |
            dist/release/*
            dist/setup/*.whl
